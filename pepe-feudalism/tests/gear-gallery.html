<!doctype html><meta charset="utf-8"><base href="../"><title>Crown equipment QA</title><style>body{margin:0;background:#e9d7a6}canvas{display:block}</style><canvas id="sheet" width="1400" height="1500"></canvas><script type="module">
import {crownAppearance,equippedPose,drawCrownFrame} from './crown-equipped.js';import {CROWN_POSES} from './crown-poses.js';import {drawShield,drawHeldWeapon,shieldImage,equipmentImage,extraWeaponImage} from './art.js';import {weaponSwing} from './motion.js';
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),images={};
const load=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src;});
await Promise.all([shieldImage,equipmentImage,extraWeaponImage].map(im=>im.complete?Promise.resolve():new Promise(r=>im.onload=r)));
for(const armor of [null,'leather','jade','basalt'])for(const weapon of ['sword','axe','spear','mace','dagger'])for(const shield of [null,'oak','jade','holy']){const look=crownAppearance({armor,weapon,shield});if(!images[look.src])images[look.src]=await load(look.src);}
window.renderSheet=(armor,index,facing=1)=>{g.fillStyle='#e9d7a6';g.fillRect(0,0,1400,1500);g.fillStyle='#233d2e';g.textAlign='left';g.font='bold 22px Georgia';g.fillText((armor??'Unarmored')+' / pose '+index+' / facing '+facing,20,30);let n=0;for(const weapon of ['sword','axe','spear','mace','dagger'])for(const shield of [null,'oak','jade','holy']){const look=crownAppearance({armor,weapon,shield}),p=look.key?equippedPose(index,look.key):CROWN_POSES[index],x=175+n%4*350,y=280+Math.floor(n/4)*290;g.save();g.translate(x,y);g.scale(facing*1.3,1.3);drawCrownFrame(g,images[look.src],p,.25);if(!look.baked){if(shield)drawShield(g,shield,...p.shield,.8);drawHeldWeapon(g,weapon,...p.hand,index===2?weaponSwing(weapon,.5):.65);}g.restore();g.fillStyle='#233d2e';g.font='16px Georgia';g.textAlign='center';g.fillText(weapon+' / '+(shield??'no shield'),x,y+28);n++;}return n;};window.ready=true;
</script>
