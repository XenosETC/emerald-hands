<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ascension panel review</title><style>body{margin:0;background:#081412;color:#eaf0d2;font:12px monospace}nav{display:flex;gap:7px;padding:10px;align-items:center;flex-wrap:wrap}button,a{font:inherit;padding:8px;background:#213d2d;border:1px solid #6c8454;color:#dcf2ad;cursor:pointer}input{width:180px}canvas{display:block;width:100%;height:calc(100dvh - 116px);image-rendering:pixelated}p{margin:8px 12px;font-size:10px;color:#9eb899}</style></head><body><nav><a href="index.html">Play game</a><span id="realms"></span><label>Altitude <input id="height" type="range" min="0" max="200000" value="0"></label><output id="alt">0 m</output><label><input id="auto" type="checkbox" style="width:auto">Auto climb</label></nav><p>VISUAL REVIEW ONLY · no rewards, upgrades, or saves · slider inspects connected realm panels</p><canvas aria-label="Realm panel inspection"></canvas><script type="module">
import {createWorldRenderer,worldAt,worlds} from './worlds.mjs';import {createActor} from './actor.mjs';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),world=createWorldRenderer(),actor=createActor();let alt=0,time=0,last=0;
document.querySelector('#realms').replaceChildren(...worlds.map(w=>{const b=document.createElement('button');b.textContent=w.id;b.onclick=()=>{alt=w.at;document.querySelector('#height').value=alt;};return b;}));document.querySelector('#height').oninput=e=>alt=Number(e.target.value);
await Promise.all([world.ready,actor.ready]);function frame(ms){const dt=last?Math.min(.04,(ms-last)/1000):0;last=ms;time+=dt;if(document.querySelector('#auto').checked){alt+=dt*(alt<500?65:alt<5000?450:5000);document.querySelector('#height').value=alt;}const W=canvas.clientWidth,H=canvas.clientHeight;canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false;world.draw(ctx,W,H,alt,time,150,false);actor.drawRig(ctx,{x:W/2,y:H*.6,scale:Math.min(1,H/700),tilt:0,squash:0},{time,active:alt>0,boost:0,heat:0,engine:4,tank:3,cooling:2,fear:0});world.foreground(ctx,W,H,alt,time);ctx.fillStyle=worldAt(alt).color;ctx.font='bold 20px monospace';ctx.fillText(worldAt(alt).name,20,35);document.querySelector('#alt').textContent=Math.floor(alt).toLocaleString()+' m';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
